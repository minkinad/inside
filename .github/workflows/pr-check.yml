name: PR Check

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check title, description, tests and UI evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const { title, body = '', user } = event.pull_request;
          if (user?.login === 'dependabot[bot]') {
            console.log('Dependabot PR metadata is generated by GitHub.');
            process.exit(0);
          }
          const changed = execFileSync('git', ['diff', '--name-only', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' }).split('\n').filter(Boolean);
          const errors = [];
          const sections = Object.fromEntries(body.split(/^## /m).slice(1).map((part) => {
            const [heading, ...lines] = part.split('\n');
            return [heading.trim(), lines.join('\n').trim()];
          }));
          const section = (heading) => sections[heading] ?? '';
          if (!/^(feat|fix|docs|chore|refactor|test|build|ci|perf|style|revert)(\([a-z0-9-]+\))?!?: .+/i.test(title)) errors.push('Use a Conventional Commits PR title.');
          if (!body.trim()) errors.push('Add a PR description.');
          if (!/- \[[xX]\]/.test(section('Type of change'))) errors.push('Select at least one Type of change.');
          const testing = section('Testing');
          if (!testing || testing.startsWith('List commands and results.')) errors.push('Fill in Testing ("Not run — docs only" is fine).');
          const breaking = section('Breaking changes');
          if (!breaking || breaking.startsWith('None, or describe')) errors.push('Fill in Breaking changes, including "None" when appropriate.');
          const uiChanged = changed.some((file) => /^apps\/web\/src\/(app|components)\//.test(file) && !file.endsWith('.css.map'));
          const screenshots = section('Screenshots');
          if (uiChanged && !/^(?:!\[|https?:\/\/|Not applicable\s*\((?!no visual changes\)).+\))/im.test(screenshots)) errors.push('Attach screenshots for UI changes or explain why they are not applicable.');
          for (const error of errors) console.error(`::error::${error}`);
          if (errors.length) process.exit(1);
          console.log(`PR metadata valid; ${changed.length} changed files.`);
          NODE
